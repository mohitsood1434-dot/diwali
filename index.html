<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Diye Jalao — Shubh Deepavali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05030a;color:#f4e6cf;font-family:Poppins,system-ui,sans-serif;overflow:hidden;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#warm{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,140,40,.32),rgba(120,30,60,.18) 45%,transparent 75%);opacity:0;transition:opacity 2.5s}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .9s}
.hide{opacity:0;pointer-events:none}
.small{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:#c99a5c}
.big{font-family:'Yatra One',serif;font-size:clamp(44px,12vw,84px);line-height:1.25;
 background:linear-gradient(180deg,#fff1c4,#ffc95a 50%,#e8862a);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 16px rgba(255,170,60,.5))}
.msg{font-size:clamp(16px,4.3vw,21px);line-height:1.6;max-width:520px;margin-top:10px;color:#f2dfc2}
input{margin-top:26px;width:min(300px,80vw);padding:14px 18px;border-radius:40px;border:1.5px solid rgba(255,190,90,.5);
 background:rgba(255,190,90,.06);color:#ffe7b8;font:500 17px Poppins;text-align:center;outline:none}
input::placeholder{color:#a88a6a}
button{margin-top:18px;padding:14px 34px;border-radius:40px;border:0;cursor:pointer;font:600 17px Poppins;color:#2a1104;
 background:linear-gradient(180deg,#ffd27a,#ff9a2e);box-shadow:0 0 24px rgba(255,150,40,.45)}
button.ghost{background:transparent;color:#ffcf80;border:1.5px solid rgba(255,190,90,.5);box-shadow:none;padding:11px 24px;font-size:15px}
#ring{position:fixed;inset:0}
.diya{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;cursor:pointer;transition:transform .2s}
.diya:active{transform:scale(.92)}
.diya svg{width:100%;height:100%;overflow:visible}
.diya .flame,.diya .halo{opacity:0;transform-origin:50px 52px;transition:opacity .5s}
.diya.lit .flame{opacity:1;animation:flick 1.1s ease-in-out infinite alternate}
.diya.lit .halo{opacity:1;animation:pulse 2s ease-in-out infinite alternate}
.diya.center{width:110px;height:110px;margin:-55px 0 0 -55px}
.diya.wait .clay{animation:nudge 1.2s ease-in-out infinite}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.94,1.08) rotate(2deg)}100%{transform:scale(1.04,.96) rotate(-1deg)}}
@keyframes pulse{from{opacity:.75}to{opacity:1}}
@keyframes nudge{0%,100%{filter:brightness(1)}50%{filter:brightness(1.6) drop-shadow(0 0 8px #ffb547)}}
#hint{position:fixed;left:0;right:0;top:calc(9vh + env(safe-area-inset-top,0px));text-align:center;padding:0 20px;transition:opacity .8s}
#hint .t{font-size:clamp(18px,5vw,24px);font-weight:600;color:#ffdca0}
#hint .c{margin-top:6px;font-size:14px;color:#b9946a;letter-spacing:2px}
#final .msg b{color:#ffd27a}
#final .from{margin-top:14px;font-size:15px;letter-spacing:3px;color:#d9b07a}
#bottom .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
#bottom .tap{margin-top:8px;font-size:12px;color:#8f7458;letter-spacing:1px}
#bottom{position:fixed;left:0;right:0;bottom:calc(3vh + env(safe-area-inset-bottom,0px));text-align:center;transition:opacity .9s}
#final{justify-content:flex-start;padding-top:calc(10vh + env(safe-area-inset-top,0px))}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="warm"></div>
<canvas id="rg"></canvas>
<canvas id="fx"></canvas>

<!-- 1. Intro -->
<div class="screen" id="intro">
 <div class="small">Mohit Sood ki taraf se</div>
 <div class="big" style="margin-top:14px">एक छोटी सी<br>रोशनी</div>
 <div class="msg">Aapke liye kuch bheja hai. Pehle apna naam likho, phir khud diye jalao.</div>
 <input id="name" maxlength="24" placeholder="Aapka naam" autocomplete="off">
 <button id="go">Shuru karo 🪔</button>
</div>

<!-- 2. Light the diyas -->
<div id="ring" class="hide"></div>
<div id="hint" class="hide"><div class="t">Andhera hai… har diye ko tap karke jalao</div><div class="c" id="count">0 / 9</div></div>

<!-- 3. Final wish -->
<div class="screen hide" id="final">
 <div class="big">शुभ दीपावली</div>
 <div class="msg" id="wish"></div>
 <div class="from">— MOHIT SOOD</div>
</div>
<div id="bottom" class="hide"><div class="row"><button class="ghost" id="again">Phir se jalao</button></div>
 <div class="tap">Screen pe kahin bhi tap karo — aatishbazi ✨</div></div>

<script>
const $=id=>document.getElementById(id);
const bg=$('bg'),rg=$('rg'),fx=$('fx');
const B=bg.getContext('2d'),R=rg.getContext('2d'),F=fx.getContext('2d');
let W,H,DPR=Math.min(2,window.devicePixelRatio||1);
function size(){W=innerWidth;H=innerHeight;[bg,rg,fx].forEach(c=>{c.width=W*DPR;c.height=H*DPR;c.getContext('2d').setTransform(DPR,0,0,DPR,0,0)});drawStars();placeDiyas();if(rangoliT>0)drawRangoli(rangoliT)}
// ---------- stars ----------
let seed=11;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
function drawStars(){seed=11;B.clearRect(0,0,W,H);
 const g=B.createRadialGradient(W/2,H*.55,0,W/2,H*.55,Math.max(W,H)*.8);g.addColorStop(0,'#1d0b24');g.addColorStop(.5,'#0d0514');g.addColorStop(1,'#05030a');
 B.fillStyle=g;B.fillRect(0,0,W,H);
 for(let i=0;i<160;i++){B.fillStyle=`rgba(255,${200+rnd()*55|0},${170+rnd()*80|0},${.15+rnd()*.6})`;B.beginPath();B.arc(rnd()*W,rnd()*H,rnd()*1.4+.2,0,7);B.fill()}}
// ---------- audio ----------
let AC=null;function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
const NOTES=[523.25,587.33,659.25,783.99,880,1046.5,1174.7,1318.5,1568];
function chime(i){const a=ac();if(!a)return;const t=a.currentTime;
 [1,2.01].forEach((m,k)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=NOTES[i%9]*m;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(k?0.05:0.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
 o.connect(g).connect(a.destination);o.start(t);o.stop(t+1.7)})}
function boom(){const a=ac();if(!a)return;const t=a.currentTime,n=a.sampleRate*.8,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=buf;f.type='lowpass';f.frequency.value=600+Math.random()*500;g.gain.value=.35;
 s.connect(f).connect(g).connect(a.destination);s.start(t)}
// ---------- diyas ----------
const SVG=`<svg viewBox="0 0 100 100"><defs>
<radialGradient id="h" cx="50%" cy="45%" r="50%"><stop offset="0" stop-color="#ffcf6b" stop-opacity=".8"/><stop offset=".5" stop-color="#ff8a1e" stop-opacity=".25"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></radialGradient>
<linearGradient id="f" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a00"/><stop offset=".5" stop-color="#ffb02e"/><stop offset="1" stop-color="#fff6d6"/></linearGradient>
<linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9733a"/><stop offset="1" stop-color="#7a2a10"/></linearGradient></defs>
<circle class="halo" cx="50" cy="45" r="62" fill="url(#h)"/>
<g class="flame"><path d="M50 14 C40 32 40 44 50 54 C60 44 60 32 50 14Z" fill="url(#f)"/><path d="M50 32 C46 41 46 48 50 53 C54 48 54 41 50 32Z" fill="#fffbe9"/></g>
<g class="clay"><path d="M14 58 Q50 52 86 58 L88 56 Q82 88 50 90 Q20 88 14 58Z" fill="url(#cl)"/>
<ellipse cx="50" cy="58" rx="36" ry="6" fill="#3a1206"/><path d="M86 58 L97 53 L88 62Z" fill="#b8501f"/>
<path d="M26 70 H40 L44 74 H56 L60 70 H74" stroke="#ffcf7a" stroke-width="1.6" fill="none" opacity=".8"/>
<circle cx="26" cy="70" r="2" fill="#ffe2a0"/><circle cx="74" cy="70" r="2" fill="#ffe2a0"/><rect x="49" y="52" width="2" height="5" fill="#2a120a"/></g></svg>`;
const ring=$('ring');let diyas=[],lit=0;
for(let i=0;i<9;i++){const d=document.createElement('div');d.className='diya'+(i===8?' center':'');d.innerHTML=SVG;d.dataset.i=i;ring.appendChild(d);diyas.push(d);
 d.addEventListener('click',e=>{e.stopPropagation();light(d)})}
function placeDiyas(){const cx=W/2,cy=H*.56,r=Math.min(W*.36,H*.27,230);
 diyas.forEach((d,i)=>{if(i===8){d.style.left=cx+'px';d.style.top=cy+'px';return}
  const a=i/8*Math.PI*2-Math.PI/2;d.style.left=cx+r*Math.cos(a)+'px';d.style.top=cy+r*Math.sin(a)+'px'})}
function light(d){const i=+d.dataset.i;if(d.classList.contains('lit'))return;
 if(i===8&&lit<8){d.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:260});$('hint').querySelector('.t').textContent='Beech wala diya sabse aakhir mein…';return}
 d.classList.add('lit');lit++;chime(lit-1);sparkAt(d);
 $('count').textContent=lit+' / 9';
 const msgs=['Pehla diya — andhera kam hua','Ek aur…','Roshni badh rahi hai','Aadhe raaste…','Bas thode aur','Wah! Chalte raho','Do aur…','Ab beech wala bada diya 🪔'];
 if(lit<=8)$('hint').querySelector('.t').textContent=msgs[lit-1];
 if(lit===8)diyas[8].classList.add('wait');
 if(lit===9){diyas[8].classList.remove('wait');setTimeout(finale,700)}}
function sparkAt(d){const b=d.getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height*.25,26,['#ffd27a','#ffb547','#fff2c8'],1.6,false)}
// ---------- rangoli ----------
let rangoliT=0;
const LAYERS=[{k:8,r0:.42,r1:.18,c:'rgba(255,200,100,.9)',w:2.2},{k:12,r0:.62,r1:.14,c:'rgba(255,120,150,.75)',w:1.8},
 {k:16,r0:.82,r1:.10,c:'rgba(255,170,60,.8)',w:1.6},{k:6,r0:.25,r1:.2,c:'rgba(255,235,170,.9)',w:2},{k:24,r0:.98,r1:.05,c:'rgba(190,140,255,.55)',w:1.4}];
function drawRangoli(t){R.clearRect(0,0,W,H);const cx=W/2,cy=H*.56,S=Math.min(W*.48,H*.36,300);
 R.shadowColor='#ff9a2a';R.shadowBlur=10;
 LAYERS.forEach((L,li)=>{const lt=Math.max(0,Math.min(1,t*1.6-li*.15));if(!lt)return;const N=720,end=N*lt|0;
  R.strokeStyle=L.c;R.lineWidth=L.w;R.beginPath();
  for(let j=0;j<=end;j++){const th=j/N*Math.PI*2,rr=S*(L.r0-L.r1+L.r1*Math.abs(Math.cos(L.k/2*th)));
   const x=cx+rr*Math.cos(th-Math.PI/2),y=cy+rr*Math.sin(th-Math.PI/2);j?R.lineTo(x,y):R.moveTo(x,y)}R.stroke();
  // dots on petal tips
  if(lt>.98){R.fillStyle=L.c;for(let p=0;p<L.k;p++){const th=p/L.k*Math.PI*2-Math.PI/2;R.beginPath();R.arc(cx+S*L.r0*Math.cos(th),cy+S*L.r0*Math.sin(th),L.w+1,0,7);R.fill()}}});
 R.shadowBlur=0}
function animRangoli(){const st=performance.now();(function f(n){rangoliT=Math.min(1,(n-st)/3200);drawRangoli(rangoliT);if(rangoliT<1)requestAnimationFrame(f)})(st)}
// ---------- fireworks ----------
let P=[],rockets=[],auto=null;
const PAL=[['#ffd27a','#ffb547','#fff2c8'],['#ff6b9a','#ffb3c8','#fff'],['#8fd3ff','#c9ecff','#fff'],['#b48cff','#e0ccff','#fff'],['#7ee08a','#c8ffcf','#fff'],['#ff8a3d','#ffd0a8','#fff']];
function burst(x,y,n,cols,sp,big=true){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(big?Math.random()*3.2+1.2:Math.random()*2+.6)*sp;
 P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,dec:.008+Math.random()*.012,c:cols[i%cols.length],s:big?2.2:1.6})}}
function rocket(tx,ty){const cols=PAL[Math.random()*PAL.length|0];rockets.push({x:tx+(Math.random()-.5)*40,y:H+10,tx,ty,cols})}
function loop(){F.globalCompositeOperation='destination-out';F.fillStyle='rgba(0,0,0,.22)';F.fillRect(0,0,W,H);F.globalCompositeOperation='lighter';
 rockets=rockets.filter(r=>{r.y-=Math.max(4,(r.y-r.ty)*.06);r.x+=(r.tx-r.x)*.05;F.fillStyle='#ffe2a8';F.beginPath();F.arc(r.x,r.y,2.2,0,7);F.fill();
  if(r.y-r.ty<6){burst(r.x,r.y,90,r.cols,1.1);boom();return false}return true});
 P=P.filter(p=>{p.vx*=.985;p.vy=p.vy*.985+.045;p.x+=p.vx;p.y+=p.vy;p.life-=p.dec;if(p.life<=0)return false;
  F.globalAlpha=p.life;F.fillStyle=p.c;F.beginPath();F.arc(p.x,p.y,p.s,0,7);F.fill();return true});
 F.globalAlpha=1;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
// ---------- flow ----------
let NAME='';
function cleanName(s){return s.replace(/[<>]/g,'').trim().slice(0,24)}
try{const h=decodeURIComponent(location.hash.slice(1)).replace(/-/g,' ');if(h)$('name').value=cleanName(h)}catch(e){}
$('go').onclick=()=>{ac();NAME=cleanName($('name').value);$('intro').classList.add('hide');
 setTimeout(()=>{$('ring').classList.remove('hide');$('hint').classList.remove('hide')},500)};
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
function finale(){$('hint').classList.add('hide');$('warm').style.opacity=1;animRangoli();
 diyas.forEach(d=>{d.style.transition='opacity 1.5s';d.style.opacity=.9});
 const who=NAME?`<b>${NAME.replace(/&/g,'&amp;')} ji</b>, `:'';
 $('wish').innerHTML=`${who}${NAME?"jaise":"Jaise"} aapne abhi andhere mein 9 diye jalaaye — waise hi aapki zindagi mein khushiyan, sehat aur safalta ki roshni hamesha bani rahe.`;
 setTimeout(()=>{$('final').classList.remove('hide');$('bottom').classList.remove('hide')},900);
 let k=0;const show=()=>{rocket(W*(.15+Math.random()*.7),H*(.12+Math.random()*.3));if(++k<10)auto=setTimeout(show,450+Math.random()*400)};show()}
document.addEventListener('click',e=>{if(lit===9&&!e.target.closest('button')){ac();rocket(e.clientX,Math.min(e.clientY,H*.6))}});
$('again').onclick=e=>{e.stopPropagation();clearTimeout(auto);lit=0;rangoliT=0;R.clearRect(0,0,W,H);$('warm').style.opacity=0;$('final').classList.add('hide');$('bottom').classList.add('hide');
 diyas.forEach(d=>{d.classList.remove('lit','wait');d.style.opacity=1});$('count').textContent='0 / 9';
 $('hint').querySelector('.t').textContent='Andhera hai… har diye ko tap karke jalao';setTimeout(()=>$('hint').classList.remove('hide'),600)};
addEventListener('resize',size);size();
</script>
</body>
</html>
